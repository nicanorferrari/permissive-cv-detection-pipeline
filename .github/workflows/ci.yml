name: CI & License Audit Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  license-and-lint:
    name: Permissive License Verification & Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install CPU Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install onnx onnxruntime onnxsim onnxscript numpy pillow pyyaml tqdm pip-licenses pytest

      - name: Run Unit Tests
        run: |
          python tests/test_transforms.py

      - name: Execute Automated License Gate
        run: |
          python scripts/audit_licenses.py

      - name: Verify ONNX Export & Benchmark Engine
        run: |
          python src/export/export_onnx.py
          python src/inference/benchmark_cpu.py
