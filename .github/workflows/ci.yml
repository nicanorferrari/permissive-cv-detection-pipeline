name: CI & License Audit Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  license-and-lint:
    name: Permissive License Verification & Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Automated License Gate
        run: |
          python scripts/audit_licenses.py

      - name: Verify ONNX Export & Benchmark Scripts
        run: |
          python src/export/export_onnx.py
          python src/inference/benchmark_cpu.py
